name: Refresh jobs

on:
  schedule:
    # Spare trigger only: the dependable one is Supabase's timer calling /api/tick at :22 and :52.
    - cron: "4,34 * * * *"   # quick: new postings only (each site has its own cadence inside)
    - cron: "47 20 * * *"    # full sweep: 2:17 AM India time (UTC+5:30)
  workflow_dispatch:         # the timer, the "Check now" link, or "Run workflow" on GitHub
    inputs:
      mode:
        description: quick or full
        default: quick
      force:
        description: ignore per-site cadence (true/false)
        default: "false"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_filters.py
      - name: Scrape
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "47 20 * * *" ]; then MODE=full; fi
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python run_scrape.py --mode "${MODE:-quick}" $FORCE
